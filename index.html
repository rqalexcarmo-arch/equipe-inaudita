:root{--navy:#06263a;--navy2:#0d4a72;--ouro:#c2a24e;--ouro-cl:#e0c074;--txt:#f2f6f8;--txt2:#a9c3d2;--alerta:#e08a76}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:var(--txt);font-family:'Lora',Georgia,serif;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}

.box{position:relative;z-index:1;width:100%;max-width:420px;border:1px solid rgba(194,162,78,.45);border-radius:14px;padding:34px 32px 26px;background:rgba(4,12,20,.55);box-shadow:0 20px 60px -30px rgba(0,0,0,.8)}
.box::before{content:"";position:absolute;left:32px;right:32px;top:92px;height:1px;background:linear-gradient(90deg,var(--ouro-cl),transparent)}
.wordmark{font-weight:700;letter-spacing:5px;text-transform:uppercase;font-size:1rem}
.wordmark em{font-style:normal;color:var(--ouro-cl)}
.tag{font-family:'Archivo',sans-serif;font-size:.66rem;letter-spacing:2px;text-transform:uppercase;color:var(--ouro-cl);margin-top:6px}
h1{font-size:1.6rem;font-weight:600;margin:28px 0 6px;line-height:1.15}
p{color:var(--txt2);font-size:.92rem;line-height:1.55}
label{display:block;font-family:'Archivo',sans-serif;font-size:.7rem;letter-spacing:1px;text-transform:uppercase;color:var(--txt2);margin:22px 0 6px}
input[type=password]{width:100%;font-family:'Archivo',sans-serif;font-size:1rem;padding:11px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff}
input[type=password]:focus{outline:2px solid var(--ouro);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.84rem;color:var(--txt2)}
.row input{accent-color:var(--ouro)}
button{margin-top:18px;width:100%;font-family:'Archivo',sans-serif;font-weight:600;font-size:.9rem;padding:12px;border:0;border-radius:8px;background:var(--ouro);color:#16202a;cursor:pointer;letter-spacing:.3px}
button:hover{background:var(--ouro-cl)}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--alerta);font-size:.86rem;margin-top:12px;min-height:1.2em}
.foot{margin-top:22px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);font-size:.74rem;color:var(--txt2);line-height:1.5}

<script>
(function(){
  var pl=JSON.parse(document.getElementById('payload').textContent);
  var b64=function(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;};
  var toB64=function(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);};
  var salt=b64(pl.salt),iv=b64(pl.iv),data=b64(pl.data);
  var KEYK='if-sdr-k';
  function deriveKey(pwd){var enc=new TextEncoder().encode(pwd);return crypto.subtle.importKey('raw',enc,'PBKDF2',false,['deriveKey']).then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:pl.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['decrypt']);});}
  function open(key,remember){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data).then(function(buf){var html=new TextDecoder().decode(buf);return crypto.subtle.exportKey('raw',key).then(function(raw){try{(remember?localStorage:sessionStorage).setItem(KEYK,toB64(raw));}catch(e){}document.open();document.write(html);document.close();});});}
  function tryStored(){var s=null;try{s=localStorage.getItem(KEYK)||sessionStorage.getItem(KEYK);}catch(e){}if(!s)return;crypto.subtle.importKey('raw',b64(s),{name:'AES-GCM'},true,['decrypt']).then(function(k){return open(k,false);}).catch(function(){try{localStorage.removeItem(KEYK);sessionStorage.removeItem(KEYK);}catch(e){}});}
  if(!window.crypto||!crypto.subtle){document.getElementById('e').textContent='O acesso seguro só funciona pelo endereço do time (https) ou abrindo o arquivo direto no Chrome, Edge, Safari ou Firefox atualizados.';return;}
  tryStored();
  document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();var b=document.getElementById('b'),e=document.getElementById('e');b.disabled=true;b.textContent='Abrindo...';e.textContent='';
    deriveKey(document.getElementById('s').value).then(function(k){return open(k,document.getElementById('lembrar').checked);}).catch(function(){e.textContent='Senha incorreta. Tente de novo ou peça a senha à direção.';b.disabled=false;b.textContent='Entrar';});});
})();
